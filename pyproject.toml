[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-assistant"
version = "0.1.0"
description = "Intelligent AI Coding Assistant with RAG, intent routing, and sandboxed code execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "chromadb>=0.5",
    "datasets>=2.20",
    "tiktoken>=0.7",
    "pypdf>=4.3",


    "numpy<2",
    "transformers==4.51.1",
    "sentence-transformers==2.7.0",
    "accelerate>=0.26.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["data/", "scripts/"]